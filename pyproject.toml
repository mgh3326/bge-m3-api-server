[project]
name = "openai-compatible-bge-m3-server"
version = "0.1.0"
description = "Local OpenAI-compatible embedding server for BAAI/bge-m3"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Pin FlagEmbedding to the 1.3 line on macOS Intel: 1.4.x passes
    # dtype=... into AutoModel.from_pretrained, which is incompatible with
    # transformers 4.44 and torch 2.2.x.
    "FlagEmbedding==1.3.5",
    # macOS Intel + Python 3.12 currently resolves to torch 2.2.x;
    # keep NumPy 1.x because those wheels are built against the NumPy 1 ABI.
    "numpy<2",
    "torch>=2.0",
    # FlagEmbedding 1.3.5 works with the 4.44 line on macOS Intel;
    # newer transformers 4.56+ enforce torch>=2.6 for .bin weights, but
    # torch>=2.5 lacks macOS x86_64 wheels in this environment.
    "transformers==4.44.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "openai>=1.0",
]

[project.scripts]
bge-m3-server = "bge_m3_server.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
